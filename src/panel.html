<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Website Performance Check</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <div id="domain">Website Performance Check</div>
    <div class="header-actions">
      <button id="refresh" title="Refresh" aria-label="Refresh">↻</button>
      <button id="settings" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>
  <main id="app">
    <div class="loading">
      <svg class="spinner" viewBox="0 0 50 50" aria-hidden="true">
        <circle class="track" cx="25" cy="25" r="20"></circle>
        <circle class="arc" cx="25" cy="25" r="20"></circle>
      </svg>
      <div class="loading-text">Analyzing<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
